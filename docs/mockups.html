<title>Timberline Mockups</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: the app frame (spruce department rail + one top bar + tabs + work area, optional Assistant dock)
   sits on top; below it, the "notes" band explains the window: what it's for, what to check, what the
   Assistant can do. Palette A (spruce & crayon). */
:root{
  --rail:#16302b; --rail-2:#1f413a; --rail-fg:#d7e4df; --rail-dim:#8fa9a1;
  --brand:#1f5c4f; --brand-fg:#ffffff; --brand-soft:#e2efeb;
  --crayon:#f2b705; --crayon-ink:#2a2200; --crayon-soft:#fdf3cf;
  --bg:#eef1ef; --surface:#ffffff; --surface-2:#f6f8f7; --line:#d9dfdc; --line-2:#c7cfcb;
  --fg:#17211e; --muted:#5b6b66;
  --ok:#1f8a4c; --warn:#b86e00; --bad:#c23b2b; --info:#2b6cb0;
  --ok-bg:#e3f4ea; --warn-bg:#fdf0db; --bad-bg:#fbe5e2; --info-bg:#e3eefa;
  --wood-1:#c9955b; --wood-2:#ddb57f; --wood-3:#a8743f; --wood-4:#e8c99a; --wood-ink:#2b1d0e;
  --paper:#ffffff; --paper-fg:#1b1b1b; --paper-line:#cfcfcf;
  --scrim:rgba(14,24,21,.45);
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --rail:#0d1c19; --rail-2:#173029; --rail-fg:#d7e4df; --rail-dim:#7f978f;
  --brand:#5fb59e; --brand-fg:#0b1a16; --brand-soft:#173029;
  --crayon:#f5c431; --crayon-ink:#2a2200; --crayon-soft:#3a3010;
  --bg:#101614; --surface:#18201d; --surface-2:#1d2724; --line:#2c3833; --line-2:#3a4842;
  --fg:#e4ece9; --muted:#9aaba5;
  --ok:#4cc07f; --warn:#e6a23c; --bad:#ef7a6b; --info:#73a7e6;
  --ok-bg:#163223; --warn-bg:#3a2a10; --bad-bg:#3c1c18; --info-bg:#172a40;
  --wood-1:#b9864e; --wood-2:#cfa46c; --wood-3:#93632f; --wood-4:#d9b886;
  --paper:#f4f4f2; --paper-fg:#1b1b1b; --paper-line:#c9c9c9; --scrim:rgba(0,0,0,.55);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --rail:#0d1c19; --rail-2:#173029; --rail-fg:#d7e4df; --rail-dim:#7f978f;
  --brand:#5fb59e; --brand-fg:#0b1a16; --brand-soft:#173029;
  --crayon:#f5c431; --crayon-ink:#2a2200; --crayon-soft:#3a3010;
  --bg:#101614; --surface:#18201d; --surface-2:#1d2724; --line:#2c3833; --line-2:#3a4842;
  --fg:#e4ece9; --muted:#9aaba5;
  --ok:#4cc07f; --warn:#e6a23c; --bad:#ef7a6b; --info:#73a7e6;
  --ok-bg:#163223; --warn-bg:#3a2a10; --bad-bg:#3c1c18; --info-bg:#172a40;
  --wood-1:#b9864e; --wood-2:#cfa46c; --wood-3:#93632f; --wood-4:#d9b886;
  --paper:#f4f4f2; --paper-fg:#1b1b1b; --paper-line:#c9c9c9; --scrim:rgba(0,0,0,.55);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--crayon);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:12px} .r{text-align:right} .nowrap{white-space:nowrap}

/* ---------- mockup chrome (outside the app) ---------- */
.mbar{max-width:1720px;margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.mbar .ttl{font-family:var(--f-display);font-weight:800;font-size:18px}
.mbar .ttl span{color:var(--muted);font-weight:600}
.mbar nav{display:flex;gap:6px;flex-wrap:wrap}
.mbar nav a{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);text-decoration:none;color:var(--fg);font-size:13px}
.mbar nav a[aria-current="page"]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.mbar .pn{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:13px}
.mbar .pn a{padding:6px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;color:var(--fg)}

/* ---------- app frame ---------- */
.app{max-width:1720px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);min-height:720px}
.rail{background:var(--rail);color:var(--rail-fg);display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;padding:16px 18px 14px;font-family:var(--f-display);font-weight:800;font-size:17px}
.dept{display:flex;align-items:center;gap:12px;padding:10px 20px;color:var(--rail-fg);text-decoration:none;position:relative;font-size:14px}
.dept svg{flex:none;opacity:.85}
.dept:hover{background:var(--rail-2)}
.dept[aria-current="true"]{background:var(--rail-2);font-weight:600}
.dept[aria-current="true"]::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--crayon);border-radius:0 2px 2px 0}
.rail .sep{flex:1}
.rail .foot{padding:12px 20px;color:var(--rail-dim);font-size:12px}
.main{display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--line)}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;color:var(--muted);min-width:0;max-width:460px}
.search span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{display:flex;align-items:center;gap:8px;margin-left:auto}
.lang{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:12px;font-weight:600}
.lang span{padding:5px 8px;color:var(--muted)} .lang span.on{background:var(--brand);color:var(--brand-fg)}
.ask{background:var(--crayon);color:var(--crayon-ink);font-weight:600;border:0;border-radius:var(--r);padding:7px 12px;display:flex;gap:6px;align-items:center}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--brand-fg);display:grid;place-items:center;font-size:12px;font-weight:700}
.bell{position:relative;padding:4px}.bell::after{content:"";position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
.tabs{display:flex;gap:6px;padding:0 24px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs a{padding:11px 12px 9px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500;text-decoration:none}
.tabs a[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--brand)}
.body{display:grid;grid-template-columns:minmax(0,1fr);flex:1;background:var(--bg);position:relative}
.body.with-dock{grid-template-columns:minmax(0,1fr) 320px}
.work{padding:24px 28px 32px;display:flex;flex-direction:column;gap:20px;min-width:0}

/* ---------- page parts ---------- */
.ph{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between}
.ph .crumb{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ph h2{font-size:24px;font-weight:700}
.ph .sub{color:var(--muted);margin-top:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 12px;font-weight:500;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.btn.ghost{background:none;border-color:transparent;color:var(--brand)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.chip.now{background:var(--crayon);color:var(--crayon-ink);border-color:transparent}
.chip.brand{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.stages{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.stages .arrow{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
.g{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;min-width:0}
.g .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.g .v{font-family:var(--f-num);font-size:22px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.g .v small{font-size:12px;color:var(--muted);font-weight:400}
.g .note{font-size:12px;margin-top:6px;color:var(--muted)}
.g.warn .note{color:var(--warn)} .g.bad .note{color:var(--bad)} .g.ok .note{color:var(--ok)}
.bar{height:6px;background:var(--surface-2);border-radius:3px;margin-top:8px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ok)}
.g.warn .bar i{background:var(--warn)} .g.bad .bar i{background:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>.hd{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:14px 18px 10px;flex-wrap:wrap}
.panel>.hd h3{font-size:15px;font-weight:600;font-family:var(--f-body)}
.panel>.bd{padding:0 18px 16px}
.panel>.bd.flush{padding:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:20px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:20px;align-items:start}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1300px){.split{grid-template-columns:1fr}}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:10px 18px 8px;white-space:nowrap}
.t td{padding:10px 18px;border-top:1px solid var(--line);vertical-align:top}
.t td.num,.t th.num{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.t tr.sel td{background:var(--crayon-soft)}
.t tr.sub td{color:var(--muted);font-size:12px}
.t tfoot td{font-weight:600;border-top:2px solid var(--line-2)}
.t .diff{background:var(--warn-bg)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:0 18px 12px}
.filter{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;background:var(--surface)}
.filter.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.input{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 10px;min-height:34px;display:flex;align-items:center;gap:6px}
.input.ro{background:var(--surface-2)}
.input .unit{margin-left:auto;color:var(--muted);font-size:12px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:14px}
.check{display:flex;gap:8px;align-items:center}
.box{width:16px;height:16px;border:1px solid var(--line-2);border-radius:3px;display:inline-grid;place-items:center;font-size:11px;background:var(--surface)}
.box.on{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.toggle{width:32px;height:18px;border-radius:9px;background:var(--line-2);position:relative;display:inline-block;flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff}
.toggle.on{background:var(--brand)} .toggle.on::after{left:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg span{padding:5px 10px;font-size:12px;background:var(--surface)}
.seg span.on{background:var(--brand);color:var(--brand-fg)}
.callout{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:var(--r);font-size:13px;border:1px solid var(--line);background:var(--surface)}
.callout.warn{background:var(--warn-bg);border-color:transparent}
.callout.info{background:var(--info-bg);border-color:transparent}
.callout.ok{background:var(--ok-bg);border-color:transparent}
.callout.bad{background:var(--bad-bg);border-color:transparent}
.callout .btn{margin-left:auto}
.drop{border:2px dashed var(--line-2);border-radius:8px;padding:22px;text-align:center;color:var(--muted);background:var(--surface-2)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.li .grow{flex:1;min-width:0}
.li b{font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;display:inline-block}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)} .dot.info{background:var(--info)}
.bottombar{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;padding:12px 18px;background:var(--rail);color:var(--rail-fg);border-radius:var(--r)}
.bottombar .btn{background:var(--rail-2);color:var(--rail-fg);border-color:transparent}
.bottombar .btn.primary{background:var(--crayon);color:var(--crayon-ink)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-body)}
.chart .ax{stroke:var(--line)}

/* bundles / trailer drawing */
.b{border-radius:2px;font:600 11px var(--f-num);display:grid;place-items:center;color:var(--wood-ink);background-color:var(--wood-2);
  background-image:repeating-linear-gradient(90deg,transparent 0 9px,rgba(0,0,0,.08) 9px 10px)}
.b.v{background-image:repeating-linear-gradient(0deg,transparent 0 9px,rgba(0,0,0,.08) 9px 10px)}
.b.w1{background-color:var(--wood-1)} .b.w3{background-color:var(--wood-3);color:#fff6ea} .b.w4{background-color:var(--wood-4)}
.b.fill{outline:2px dashed var(--warn);outline-offset:-2px}
.b.empty{background:none;border:1px dashed var(--line-2);color:var(--muted)}

/* Assistant dock */
.dock{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-width:0}
.dock header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}
.msgs{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px;font-size:13px}
.m{padding:9px 11px;border-radius:8px;max-width:92%}
.m.me{align-self:flex-end;background:var(--surface-2);border:1px solid var(--line)}
.m.ai{background:var(--info-bg)}
.propose{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.propose .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.compose{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
.compose .input{flex:1}

/* overlays: dialogs + documents */
.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding:28px 20px;z-index:2;overflow:auto}
.dialog{background:var(--surface);border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.25);width:min(760px,100%);display:flex;flex-direction:column}
.dialog.wide{width:min(1100px,100%)}
.dialog>header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dialog>header h3{font-size:17px}
.dialog>header .x{margin-left:auto;color:var(--muted)}
.dialog>.bd{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.dialog>footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.docbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;width:min(900px,100%);margin:0 auto 12px;color:#fff}
.docbar .btn{background:var(--surface);}
.paper{background:var(--paper);color:var(--paper-fg);width:min(900px,100%);margin:0 auto;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:44px 48px;font-size:12.5px;line-height:1.45;border-radius:2px}
.paper h1{font-size:22px;letter-spacing:.02em;color:var(--paper-fg)}
.paper .lh{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:2px solid var(--paper-fg);padding-bottom:12px;margin-bottom:16px}
.paper .co{font-family:var(--f-display);font-weight:800;font-size:18px}
.paper .meta{display:grid;grid-template-columns:auto auto;gap:2px 14px;font-size:12px}
.paper .meta b{font-weight:600}
.paper .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:16px}
.paper .box2{border:1px solid var(--paper-line);padding:8px 10px}
.paper .box2 .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#666;margin-bottom:2px}
.paper table{width:100%;border-collapse:collapse;margin:8px 0 14px}
.paper th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;text-align:left;border-bottom:1.5px solid var(--paper-fg);padding:6px 6px}
.paper td{border-bottom:1px solid var(--paper-line);padding:6px 6px;vertical-align:top}
.paper td.num,.paper th.num{text-align:right;font-family:var(--f-num)}
.paper .blank{display:inline-block;min-width:70px;border-bottom:1.5px solid var(--paper-fg);height:16px}
.paper .sig{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px;margin-top:28px}
.paper .sig div{border-top:1px solid var(--paper-fg);padding-top:4px;font-size:11px;color:#555}
.paper .fine{font-size:10.5px;color:#555;margin-top:14px}
.paper .tot{margin-left:auto;width:min(300px,100%)}
.paper .tot td{border:0;padding:3px 6px}
.paper .tot tr:last-child td{font-weight:700;border-top:1.5px solid var(--paper-fg)}

/* notes band below the frame */
.notes{max-width:1720px;margin:18px auto 0;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:16px}
.note-c{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.note-c h3{font-size:14px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.note-c h3 i{width:10px;height:10px;border-radius:2px;background:var(--brand);display:inline-block}
.note-c.q h3 i{background:var(--crayon)} .note-c.a h3 i{background:var(--info)}
.note-c p{margin:0 0 8px;max-width:70ch}
.note-c ul{margin:0;padding-left:18px} .note-c li{margin:3px 0}
.note-c .ref{font-size:12px;color:var(--muted);margin-top:8px}

/* index + guide + workflow pages */
.page{max-width:1720px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.hero h1{font-size:28px;font-weight:800}
.hero p{color:var(--muted);max-width:80ch;margin:6px 0 0}
.idx{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px}
.idx .grp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.idx .grp h3{font-size:15px;display:flex;gap:8px;align-items:center;margin-bottom:6px}
.idx a{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--fg);font-size:13px}
.idx a:first-of-type{border-top:0}
.idx a span{color:var(--muted);font-size:12px}
.guide-sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 22px}
.guide-sec h2{font-size:18px;margin-bottom:10px}
.gi{border-top:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:minmax(160px,220px) minmax(0,1fr);gap:6px 20px}
.gi:first-of-type{border-top:0}
.gi .nm a{font-weight:600;text-decoration:none}
.gi .nm .small{display:block}
.gi p{margin:0 0 6px;max-width:90ch}
.gi ul{margin:0;padding-left:18px;color:var(--muted);font-size:13px}
.wf{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;overflow-x:auto}
.wf svg{display:block;min-width:1100px;width:100%;height:auto}
.wf .node rect{fill:var(--surface);stroke:var(--line-2);stroke-width:1.5}
.wf .node:hover rect{stroke:var(--brand);stroke-width:2.5}
.wf .node text{fill:var(--fg);font:600 13px var(--f-body)}
.wf .node text.s{fill:var(--muted);font:400 11px var(--f-body)}
.wf .node.story rect{fill:var(--brand-soft);stroke:var(--brand)}
.wf .lane{fill:var(--surface-2)}
.wf .lane-t{fill:var(--muted);font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase}
.wf .edge{stroke:var(--muted);stroke-width:1.5;fill:none}
.wf .edge.alt{stroke-dasharray:5 4}
.wf .arrowhead{fill:var(--muted)}

@media (max-width:1100px){.body.with-dock{grid-template-columns:1fr}.body.with-dock .dock{display:none}.notes{grid-template-columns:1fr}}
@media (max-width:760px){

  .rail{display:none}
  .work{padding:16px}
  .top{padding:10px 14px}.tabs{padding:0 14px}
  .ask span,.lang{display:none}
  .paper{padding:24px 18px}
  .gi{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const ICON = {

const icon = (k, s = 16, extra = '') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${ICON[k] || ''}</svg>`;

const H = {
  icon,
  /** Page header. crumb, title, sub (optional), right-side HTML (buttons) */
  head: (crumb, title, sub = '', right = '') => `<div class="ph"><div>${crumb ? `<div class="crumb">${crumb}</div>` : ''}<h2>${title}</h2>${sub ? `<div class="sub">${sub}</div>` : ''}</div>${right ? `<div class="btns">${right}</div>` : ''}</div>`,
  btn: (t, kind = '', ic = '') => `<button class="btn ${kind}">${ic ? icon(ic, 15) : ''}${t}</button>`,
  /** link button that jumps to another window by id */
  go: (t, id, kind = '', ic = '') => `<a class="btn ${kind}" href="#${id}" style="text-decoration:none">${ic ? icon(ic, 15) : ''}${t}</a>`,
  chip: (t, kind = '') => `<span class="chip ${kind}">${t}</span>`,
  dot: (kind = '') => `<span class="dot ${kind}"></span>`,
  /** Status strip; nowIndex = current stage, earlier ones show done */
  stages: (list, now) => `<div class="stages">${list.map((s, i) => `${i ? '<span class="arrow">›</span>' : ''}<span class="chip ${i < now ? 'ok' : i === now ? 'now' : ''}">${s}</span>`).join('')}</div>`,
  /** Gauge tile: label, value html, pct (0-100+, or null for no bar), note, state ok|warn|bad|'' */
  gauge: (k, v, pct = null, note = '', state = '') => `<div class="g ${state}"><div class="k">${k}</div><div class="v">${v}</div>${pct == null ? '' : `<div class="bar"><i style="width:${Math.min(100, pct)}%"></i></div>`}${note ? `<div class="note">${note}</div>` : ''}</div>`,
  kpis: tiles => `<div class="kpis">${tiles.join('')}</div>`,
  /** Panel with title, optional right-side HTML, body; flush=true removes body padding (tables) */
  panel: (title, body, right = '', flush = false) => `<section class="panel">${title || right ? `<div class="hd"><h3>${title}</h3>${right ? `<div class="btns">${right}</div>` : ''}</div>` : ''}<div class="bd ${flush ? 'flush' : ''}">${body}</div></section>`,
  /** Table. cols: [{t:'Header', num:true}] or strings; rows: arrays of cell HTML; opts: {sel:rowIndex, foot:[cells], cls:[rowclass...]} */
  table: (cols, rows, opts = {}) => {
    const C = cols.map(c => typeof c === 'string' ? { t: c } : c);
    const th = C.map(c => `<th class="${c.num ? 'num' : ''}">${c.t}</th>`).join('');
    const tr = rows.map((r, i) => `<tr class="${opts.sel === i ? 'sel' : ''} ${(opts.cls && opts.cls[i]) || ''}">${r.map((cell, j) => `<td class="${C[j] && C[j].num ? 'num' : ''}">${cell}</td>`).join('')}</tr>`).join('');
    const tf = opts.foot ? `<tfoot><tr>${opts.foot.map((cell, j) => `<td class="${C[j] && C[j].num ? 'num' : ''}">${cell}</td>`).join('')}</tr></tfoot>` : '';
    return `<div class="tw"><table class="t"><thead><tr>${th}</tr></thead><tbody>${tr}</tbody>${tf}</table></div>`;

  /** Form field: label, value, unit, readonly */

  form: fields => `<div class="form">${fields.join('')}</div>`,

  filters: list => `<div class="toolbar">${list.map(f => `<span class="filter ${f.startsWith('*') ? 'on' : ''}">${f.replace(/^\*/, '')}</span>`).join('')}</div>`,
  seg: (opts, on) => `<span class="seg">${opts.map((o, i) => `<span class="${i === on ? 'on' : ''}">${o}</span>`).join('')}</span>`,

  /** Simple bar chart (SVG). data: [{label, value, value2?}] */
  bars: (data, opts = {}) => {
    const w = 640, h = opts.h || 200, pad = 28, max = Math.max(...data.map(d => Math.max(d.value, d.value2 || 0))) * 1.1;
    const bw = (w - pad * 2) / data.length;
    const y = v => h - pad - (v / max) * (h - pad * 2);
    return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img"><line class="ax" x1="${pad}" y1="${h - pad}" x2="${w - pad}" y2="${h - pad}"/>${data.map((d, i) => {
      const x = pad + i * bw; const two = d.value2 != null;
      const bwi = two ? bw * .34 : bw * .56;
      return `${two ? `<rect x="${x + bw * .14}" y="${y(d.value2)}" width="${bwi}" height="${h - pad - y(d.value2)}" fill="var(--line-2)" rx="2"/>` : ''}<rect x="${x + (two ? bw * .5 : bw * .22)}" y="${y(d.value)}" width="${bwi}" height="${h - pad - y(d.value)}" fill="var(--brand)" rx="2"/><text x="${x + bw / 2}" y="${h - 10}" text-anchor="middle">${d.label}</text>`;
    }).join('')}</svg>`;
  },
  /** Line chart (SVG). series: [{name, values:[...], color}] labels: [...] */
  lines: (labels, series, opts = {}) => {
    const w = 640, h = opts.h || 200, pad = 30; const all = series.flatMap(s => s.values); const min = Math.min(...all) * .95, max = Math.max(...all) * 1.05;
    const x = i => pad + i * (w - pad * 2) / (labels.length - 1), y = v => h - pad - (v - min) / (max - min) * (h - pad * 2);
    return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img"><line class="ax" x1="${pad}" y1="${h - pad}" x2="${w - pad}" y2="${h - pad}"/>${labels.map((l, i) => `<text x="${x(i)}" y="${h - 10}" text-anchor="middle">${l}</text>`).join('')}${series.map(s => `<polyline fill="none" stroke="${s.color || 'var(--brand)'}" stroke-width="2.5" ${s.dash ? 'stroke-dasharray="6 5"' : ''} points="${s.values.map((v, i) => `${x(i)},${y(v)}`).join(' ')}"/><circle cx="${x(s.values.length - 1)}" cy="${y(s.values[s.values.length - 1])}" r="4" fill="${s.color || 'var(--brand)'}"/>`).join('')}</svg>`;

  /** Dialog overlay drawn on top of a dimmed page. wide=true for big dialogs */
  dialog: (title, body, footer, wide = false) => `<div class="scrim"><div class="dialog ${wide ? 'wide' : ''}"><header><h3>${title}</h3><span class="x">✕</span></header><div class="bd">${body}</div><footer>${footer}</footer></div></div>`,
  /** Document preview: title + paper HTML; excel=false hides the Excel button */
  doc: (title, paper, excel = true) => `<div class="scrim"><div style="width:100%"><div class="docbar"><b style="color:#fff">${title}</b><div class="btns">${H.docActions(excel)}${H.btn('Close')}</div></div><div class="paper">${paper}</div></div></div>`,
  /** Letterhead for documents */
  letterhead: (docName, metaPairs) => `<div class="lh"><div><div class="co">${D.company.name}</div><div>${D.company.addr}</div><div>${D.company.phone}</div></div><div style="text-align:right"><h1>${docName}</h1><div class="meta" style="justify-content:end">${metaPairs.map(([k, v]) => `<b>${k}</b><span>${v}</span>`).join('')}</div></div></div>`,
  /** Top view of a trailer with bundles. cells: array of strings 'w1:1' (wood class : label), '' = empty, 'fill:4' filler. cols x rows grid. */
  trailer: (cells, cols = 13, rows = 2, opts = {}) => `<div style="overflow-x:auto"><div style="display:grid;grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},${opts.rowH || 46}px);gap:4px;padding:10px;border:2px solid var(--muted);border-radius:4px 14px 14px 4px;min-width:${opts.minW || 560}px;background:var(--surface-2)">${cells.map(c => { if (!c) return '<div class="b empty">+</div>'; const [cls, lab] = c.split(':'); return `<div class="b ${cls === 'fill' ? 'w4 fill' : cls}">${lab || ''}</div>`; }).join('')}</div><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px;min-width:${opts.minW || 560}px"><span>Nose (first on)</span><span>Doors (last on)</span></div></div>`,
};

  { id: 'settings', label: 'Settings', tabs: [['settings-users', 'Users & access'], ['settings-email', 'Email'], ['settings-trailers', 'Trailer types'], ['settings-carriers', 'Carriers'], ['settings-taxes', 'Taxes & currency'], ['settings-imports', 'Imports']] },
];
const WINDOWS = [];
/**
 * Register a window.
 * id: unique, used in the link (#id). For tab screens use the tab id from DEPTS.
 * dept: department id (rail highlight). tab: tab id to highlight (defaults to id).
 * kind: 'screen' | 'document' | 'dialog' (documents and dialogs are drawn over a dimmed page)
 * title: name shown in lists. intent: what it's for (1–3 sentences, plain words).
 * check: questions to confirm with BB Pallets. assistant: things the Assistant can do here.
 * ref: hand-off references, e.g. 'Hand-off 4.2, D11'. story: step number in the order story (1–9) if part of it.
 * html(): page content. dock: optional H.assistant(...) HTML to show the Assistant open.
 * under: for documents/dialogs, a function returning the page drawn underneath (optional).
 */
function S(w) { WINDOWS.push(Object.assign({ kind: 'screen', check: [], assistant: [], tab: w.id }, w)); }

// ---------------- frame + router ----------------
function frame(w) {
  const dept = DEPTS.find(d => d.id === w.dept) || DEPTS[0];
  const rail = DEPTS.map(d => `<a class="dept" href="#${d.tabs[0][0]}" aria-current="${d.id === dept.id}">${icon(d.id, 18)}<span>${d.label}</span></a>`).join('');
  const tabs = dept.tabs.map(([id, label]) => `<a href="#${id}" aria-selected="${id === w.tab}">${label}</a>`).join('');
  const under = w.kind !== 'screen' && w.under ? w.under() : '';
  const content = w.kind === 'screen' ? w.html() : under + w.html();
  return `<div class="app">
  <nav class="rail" aria-label="Departments"><div class="logo"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="2" y="15" width="22" height="4" rx="1" fill="var(--crayon)"/><rect x="2" y="20.5" width="22" height="3.5" rx="1" fill="var(--crayon)" opacity=".6"/><path d="M13 2 6 13h14z" fill="var(--rail-fg)"/></svg>Timberline</div>${rail}<div class="sep"></div><div class="foot">‹ Collapse</div></nav>
  <div class="main">
    <div class="top"><div class="search">${icon('search')}<span>Search orders, plants, items, loads…</span></div><div class="tb"><div class="lang"><span class="on">EN</span><span>FR</span></div><span class="bell">${icon('bell', 18)}</span><a class="ask" href="#dlg-assistant" style="text-decoration:none">${icon('spark')}<span>Assistant</span></a><div class="avatar">BB</div></div></div>
    <div class="tabs">${tabs}</div>
    <div class="body ${w.dock ? 'with-dock' : ''}"><div class="work" style="${w.kind !== 'screen' ? 'min-height:760px' : ''}">${content}</div>${w.dock || ''}</div>
  </div></div>`;
}
function notes(w) {
  const list = a => a.length ? `<ul>${a.map(x => `<li>${x}</li>`).join('')}</ul>` : '<p class="muted">Nothing open.</p>';
  return `<div class="notes">
    <div class="note-c"><h3><i></i>What this ${w.kind === 'screen' ? 'screen' : w.kind} is for</h3><p>${w.intent}</p>${w.story ? `<p class="small muted">Step ${w.story} of 9 in the order story.</p>` : ''}${w.ref ? `<div class="ref">${w.ref}</div>` : ''}</div>
    <div class="note-c q"><h3><i></i>To check with BB Pallets</h3>${list(w.check)}</div>
    <div class="note-c a"><h3><i></i>The Assistant here can</h3>${list(w.assistant)}</div>
  </div>`;
}
const order = () => {
  const o = []; DEPTS.forEach(d => d.tabs.forEach(([id]) => { const w = WINDOWS.find(x => x.id === id); if (w) o.push(w); WINDOWS.filter(x => x.kind !== 'screen' && x.tab === id).forEach(x => o.push(x)); }));
  WINDOWS.forEach(x => { if (!o.includes(x)) o.push(x); }); return o;
};
function mbar(cur) {
  const seq = order(); const i = seq.findIndex(x => x.id === cur);
  const pn = i >= 0 ? `<div class="pn"><span class="muted">${i + 1} of ${seq.length}</span>${i > 0 ? `<a href="#${seq[i - 1].id}">‹ Back</a>` : ''}${i < seq.length - 1 ? `<a href="#${seq[i + 1].id}">Next ›</a>` : ''}</div>` : '';
  return `<div class="mbar"><div class="ttl">Timberline <span>· mockups for BB Pallets</span></div><nav><a href="#index" ${cur === 'index' ? 'aria-current="page"' : ''}>All windows</a><a href="#story" ${cur === 'story' ? 'aria-current="page"' : ''}>Order story</a><a href="#guide" ${cur === 'guide' ? 'aria-current="page"' : ''}>Explanation sheet</a></nav>${pn}</div>`;
}
function pageIndex() {
  const groups = DEPTS.map(d => {
    const items = [];
    d.tabs.forEach(([id, label]) => { const w = WINDOWS.find(x => x.id === id); items.push(`<a href="#${id}">${label}<span>${w ? 'screen' : 'missing'}</span></a>`); WINDOWS.filter(x => x.kind !== 'screen' && x.tab === id).forEach(x => items.push(`<a href="#${x.id}">↳ ${x.title}<span>${x.kind}</span></a>`)); });
    return `<div class="grp"><h3>${icon(d.id, 18)}${d.label}</h3>${items.join('')}</div>`;
  }).join('');
  const others = WINDOWS.filter(x => x.kind !== 'screen' && !DEPTS.some(d => d.tabs.some(t => t[0] === x.tab)));
  return `<div class="page"><div class="hero"><h1>Every window in Timberline</h1><p>These are pictures of the screens, documents and dialogs, before anything is built. Click any window to see it inside the app, with notes underneath: what it's for, what we need BB Pallets to confirm, and what the Assistant can do there. Use Back and Next at the top to go through all of them in order. Leave a comment on anything to change.</p></div><div class="idx">${groups}${others.length ? `<div class="grp"><h3>Other</h3>${others.map(x => `<a href="#${x.id}">${x.title}<span>${x.kind}</span></a>`).join('')}</div>` : ''}</div></div>`;
}
function pageStory() {
  const steps = WINDOWS.filter(w => w.story).sort((a, b) => a.story - b.story || a.id.localeCompare(b.id));
  return `<div class="page"><div class="hero"><h1>The order story, click by click</h1><p>One order for Ardent Metals' Caldari Road plant in Concord, from the customer's spreadsheet to the invoice. Each step opens the window where it happens.</p></div><div class="guide-sec">${steps.map(w => `<div class="gi"><div class="nm"><span class="chip now">Step ${w.story}</span> <a href="#${w.id}">${w.title}</a></div><div><p>${w.intent}</p></div></div>`).join('')}</div></div>`;
}
function pageGuide() {
  const secs = DEPTS.map(d => {
    const ws = []; d.tabs.forEach(([id]) => { const w = WINDOWS.find(x => x.id === id); if (w) ws.push(w); WINDOWS.filter(x => x.kind !== 'screen' && x.tab === id).forEach(x => ws.push(x)); });
    return `<section class="guide-sec"><h2>${d.label}</h2>${ws.map(w => `<div class="gi"><div class="nm"><a href="#${w.id}">${w.title}</a><span class="small muted">${w.kind}${w.story ? ` · story step ${w.story}` : ''}</span></div><div><p>${w.intent}</p>${w.check.length ? `<ul>${w.check.map(c => `<li>Check: ${c}</li>`).join('')}</ul>` : ''}</div></div>`).join('')}</section>`;
  }).join('');
  return `<div class="page"><div class="hero"><h1>Explanation sheet</h1><p>What each window is for and the questions behind it, in one list. The intent comes from the 13 voice notes and the decisions made so far (D1–D31 in the hand-off). Nothing here is final: mark what's wrong and it changes before anything is built.</p></div>
  <section class="guide-sec"><h2>How the app is laid out</h2><div class="gi"><div class="nm">Departments</div><div><p>Down the left. Each one fills the page; its tabs run across the top. No dashboard of tiles. The rail collapses to icons, and on a phone it opens from a menu button.</p></div></div><div class="gi"><div class="nm">Top bar</div><div><p>The same on every page: search, English/French, notifications, the Assistant, and you.</p></div></div><div class="gi"><div class="nm">Assistant</div><div><p>On every page. It looks things up and proposes actions; a person clicks Approve before anything is sent or changed. Every screen comes with its own Assistant abilities.</p></div></div><div class="gi"><div class="nm">Documents</div><div><p>Every document has Print, PDF, Excel (where it's a table) and Email. Email goes from your own mailbox and is logged on the customer, supplier or order.</p></div></div><div class="gi"><div class="nm">Colours</div><div><p>Spruce green for actions and links. Yellow only for "you are here" and the Assistant. Green, amber and red only mean OK, close to a limit, and over.</p></div></div></section>${secs}</div>`;
}
function pageWorkflow() { return (window.WORKFLOW_HTML || ''); }

function route() {
  const id = (location.hash || '#index').slice(1);
  const root = document.getElementById('root');
  let html;
  if (id === 'index') html = mbar('index') + pageIndex();
  else if (id === 'story') html = mbar('story') + pageStory();
  else if (id === 'guide') html = mbar('guide') + pageGuide();
  else {
    const w = WINDOWS.find(x => x.id === id);
    html = w ? mbar(id) + frame(w) + notes(w) : mbar('') + `<div class="page"><div class="hero"><h1>Not drawn yet</h1><p>No window called “${esc(id)}”. <a href="#index">See all windows</a>.</p></div></div>`;
  }
  root.innerHTML = html;
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', route);

/* Workflow: the whole process as one clickable diagram. Each box opens its window. */
(function () {
  const W = 168, Hh = 54;
  const lanes = [
    ['Customer', 20, 100], ['Sales & office', 130, 190], ['Buying & stock', 330, 110], ['Subcontractor', 450, 100], ['Carrier', 560, 100],
  ];
  // id, label, sub, x, y, link, story?
  const N = [
    ['need', 'Needs sheet', 'what they will need', 40, 42, 'orders-incoming', 1],
    ['cpo', 'Official PO', 'matches the proposal', 592, 42, 'orders-orders', 5],
    ['recv', 'Receives the load', '', 1144, 42, 'loads-schedule'],

    ['prop', 'Proposal', '% of a truck, order no.', 224, 152, 'orders-proposals', 2],

    ['po', 'Purchase order', 'to the supplier', 408, 352, 'purchasing-pos'],
    ['oh', 'Inventory', 'board feet, average cost', 592, 352, 'inventory-onhand'],
    ['cnt', 'Count & recount', 'every two months', 776, 352, 'inventory-counts'],
    ['adj', 'Adjust & waste', '5% booked, true-up', 960, 352, 'inventory-adjustments'],

    ['ll', 'Loading list & slip', 'filler line blank', 960, 472, 'doc-loadlist', 7],
    ['bol', 'Bill of lading', 'carrier signs', 960, 582, 'doc-bol', 7],

  ];
  const E = [['need', 'imp'], ['imp', 'prop'], ['prop', 'plan'], ['plan', 'send'], ['send', 'cpo', 1], ['cpo', 'ord'], ['ord', 'job'], ['job', 'cut'], ['cut', 'll'], ['ll', 'bol'], ['ll', 'back'], ['back', 'inv'], ['bol', 'del'], ['del', 'recv'], ['inv', 'pay'],
    ['pb', 'pl'], ['pl', 'prop', 1], ['off', 'calc'], ['calc', 'po'], ['po', 'oh'], ['oh', 'cnt'], ['cnt', 'adj'], ['oh', 'pb', 1], ['back', 'adj', 1]];
  const pos = Object.fromEntries(N.map(n => [n[0], n]));
  const edge = ([a, b, alt]) => {
    const A = pos[a], B = pos[b];

    if (Math.abs(A[3] - B[3]) < 5) { x1 = A[3] + W / 2; x2 = B[3] + W / 2; y1 = A[4] < B[4] ? A[4] + Hh : A[4]; y2 = A[4] < B[4] ? B[4] : B[4] + Hh; return `<path class="edge ${alt ? 'alt' : ''}" d="M${x1} ${y1} L${x2} ${y2 - (A[4] < B[4] ? 6 : -6)}" marker-end="url(#ah)"/>`; }
    if (B[3] > A[3]) { x1 = A[3] + W; y1 = A[4] + Hh / 2; x2 = B[3]; y2 = B[4] + Hh / 2; }
    else { x1 = A[3]; y1 = A[4] + Hh / 2; x2 = B[3] + W; y2 = B[4] + Hh / 2; }

    return `<path class="edge ${alt ? 'alt' : ''}" d="M${x1} ${y1} H${mx} V${y2} H${x2 + (B[3] > A[3] ? -6 : 6)}" marker-end="url(#ah)"/>`;

    ${E.map(edge).join('')}
    ${N.map(([id, l, s, x, y, link, st]) => `<a href="#${link}" class="node ${st ? 'story' : ''}"><rect x="${x}" y="${y}" width="${W}" height="${Hh}" rx="7"/><text x="${x + 12}" y="${y + (s ? 22 : 32)}">${l}</text>${s ? `<text class="s" x="${x + 12}" y="${y + 40}">${s}</text>` : ''}${st ? `<circle cx="${x + W - 14}" cy="${y + 14}" r="9" fill="var(--crayon)"/><text x="${x + W - 14}" y="${y + 18}" text-anchor="middle" style="font:700 11px var(--f-num);fill:var(--crayon-ink)">${st}</text>` : ''}</a>`).join('')}
  </svg>`;
  S({

      `<div class="btns small muted">${H.chip('1–9', 'now')} order story ${H.chip('Box', '')} other windows</div>`,

})();
